name: Private builders and GHCR upload

on:
  workflow_call:
    inputs:
      mode:
        type: string
        default: image
      publish:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    # Only trusted pushes/manual runs may execute on the private network.
    if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    runs-on: [self-hosted, macOS, ARM64, cch-local]
    timeout-minutes: 140
    outputs:
      tags: ${{ steps.metadata.outputs.tags }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare image metadata
        id: metadata
        env:
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          python3 - <<'PY'
          import os, re
          repository = os.environ['REPOSITORY'].lower()
          ref = re.sub(r'[^a-z0-9_.-]+', '-', os.environ['REF_NAME'].lower()).strip('.-')[:90]
          short_sha = os.environ['GITHUB_SHA'][:12]
          version = ref if os.environ['REF_TYPE'] == 'tag' else f'{ref}-{short_sha}'
          tags = [version]
          if os.environ['REF_TYPE'] == 'tag':
              if re.fullmatch(r'v?\d+\.\d+\.\d+', ref):
                  tags.append('latest')
          elif ref == 'main':
              tags.extend(['main', 'latest'])
          else:
              tags.append(ref)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
              output.write('tags<<TAGS\n')
              output.write('\n'.join(f'ghcr.io/{repository}:{tag}' for tag in tags))
              output.write('\nTAGS\n')
          PY
      - name: Test and build on acer, with local fallback
        env:
          BUILD_VERSION: ${{ steps.metadata.outputs.version }}
          BUILD_MODE: ${{ inputs.mode }}
          REPOSITORY: ${{ github.repository }}
          CCH_BUILD_HOST: ${{ vars.CCH_BUILD_HOST || 'acer-server' }}
        run: |
          python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
          python3 scripts/ci/build.py --mode "$BUILD_MODE" --version "$BUILD_VERSION" \
            --repository "$REPOSITORY" --output "$RUNNER_TEMP/cch-image-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Upload image artifact
        if: inputs.mode != 'check'
        uses: actions/upload-artifact@v4
        with:
          name: cch-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cch-image-${{ github.run_id }}-${{ github.run_attempt }}/image.tar.gz
            ${{ runner.temp }}/cch-image-${{ github.run_id }}-${{ github.run_attempt }}/image.tar.gz.sha256
            ${{ runner.temp }}/cch-image-${{ github.run_id }}-${{ github.run_attempt }}/image-reference.txt
            ${{ runner.temp }}/cch-image-${{ github.run_id }}-${{ github.run_attempt }}/build.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Build summary
        env:
          OUTPUT_DIRECTORY: ${{ runner.temp }}/cch-image-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          cat "$OUTPUT_DIRECTORY/build.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove local image artifact
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/cch-image-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

  publish:
    if: inputs.publish && inputs.mode == 'image'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      packages: write
      actions: write
    steps:
      - name: Download the tested image
        uses: actions/download-artifact@v4
        with:
          name: cch-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: image
      - name: Verify and load image
        working-directory: image
        run: |
          sha256sum --check image.tar.gz.sha256
          docker load --input image.tar.gz
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push existing image to GHCR
        env:
          IMAGE_TAGS: ${{ needs.build.outputs.tags }}
        run: |
          source_image=$(cat image/image-reference.txt)
          while IFS= read -r tag; do
            docker tag "$source_image" "$tag"
            docker push "$tag"
            printf 'Published `%s`\n' "$tag" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$IMAGE_TAGS"
      - name: Delete transferred artifact after publication
        uses: actions/github-script@v9
        with:
          script: |
            const name = `cch-image-${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}`;
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              ...context.repo, run_id: context.runId,
            });
            for (const artifact of data.artifacts.filter(item => item.name === name)) {
              await github.rest.actions.deleteArtifact({ ...context.repo, artifact_id: artifact.id });
            }
