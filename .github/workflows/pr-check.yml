name: PR metadata check

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # Do not checkout or execute pull-request code on the private builders.
      - name: Explain trusted build coverage
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const internal = pr.head.repo?.full_name === context.repo.owner + '/' + context.repo.repo;
            await core.summary.addHeading('Build verification').addRaw(internal
              ? 'The push workflow tests and builds this branch on acer-server, with local fallback. Review that workflow result before merging.'
              : 'This external pull request has not run on private infrastructure. After reviewing the code, a maintainer can push it to a branch in this repository to run the full tests and image build.'
            ).write();
