name: Private builder verification

# Push builds already run the full suite once. This allows an explicit test-only
# run or an inexpensive connectivity/build/export smoke test.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verification mode
        type: choice
        default: check
        options: [check, smoke]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/build-image.yml
    with:
      mode: ${{ inputs.mode }}
